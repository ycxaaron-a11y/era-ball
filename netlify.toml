[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Revalidate the entry page; each release uses a unique module/CSS URL.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/release.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/releases/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
